<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ГраМетч</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#" data-i18n-attr="aria-label:logoAria">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="6" y="7" width="20" height="27" rx="4" transform="rotate(-12 16 20)" fill="var(--nope)"/>
        <rect x="14" y="5" width="20" height="27" rx="4" transform="rotate(8 24 18)" fill="var(--like)"/>
        <path d="M24 24.5c-3.6-2.4-5.6-4.3-5.6-6.6 0-1.6 1.2-2.8 2.7-2.8 1.1 0 2.1.6 2.9 1.7.8-1.1 1.8-1.7 2.9-1.7 1.5 0 2.7 1.2 2.7 2.8 0 2.3-2 4.2-5.6 6.6z" fill="var(--bg)"/>
      </svg>
      <span data-i18n="brand"></span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:searchPh;aria-label:searchAria">
    </label>
    <button class="lang-btn" id="openLang" data-i18n-attr="aria-label:langBtnAria;title:langBtnAria">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="langCode"></span>
    </button>
    <button class="matches-btn" id="openMatches" data-i18n-attr="aria-label:matchesBtnAria">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5c-5.5-3.7-8.5-6.6-8.5-10.1C3.5 8 5.3 6 7.7 6c1.7 0 3.2.9 4.3 2.5C13.1 6.9 14.6 6 16.3 6c2.4 0 4.2 2 4.2 4.4 0 3.5-3 6.4-8.5 10.1z"/></svg>
      <span data-i18n="matchesBtn"></span>
      <b id="matchCount">0</b>
    </button>
  </header>

  <div class="layout">
    <aside class="filters" id="filters" data-i18n-attr="aria-label:filtersAria">
      <section class="filter-block">
        <h2 data-i18n="howYouPlay"></h2>
        <div class="modes" id="modes" role="tablist"></div>
      </section>
      <section class="filter-block">
        <div class="filter-head">
          <h2 data-i18n="genresTitle"></h2>
          <button class="link-btn" id="clearGenres" data-i18n="clear" hidden></button>
        </div>
        <div class="genres" id="genres"></div>
        <button class="link-btn more-genres" id="moreGenres"></button>
      </section>
      <p class="hint" data-i18n="hint"></p>
    </aside>

    <main class="stage">
      <p class="deck-status" id="deckStatus" aria-live="polite"></p>
      <div class="deck" id="deck"></div>
      <div class="actions">
        <button class="act act-undo" id="btnUndo" data-i18n-attr="aria-label:undo;title:undoTitle">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="act act-nope" id="btnNope" data-i18n-attr="aria-label:nope;title:nopeTitle">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="act act-super" id="btnSuper" data-i18n-attr="aria-label:superLike;title:superTitle">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
        </button>
        <button class="act act-like" id="btnLike" data-i18n-attr="aria-label:like;title:likeTitle">
          <svg viewBox="0 0 24 24"><path d="M12 20.5c-5.5-3.7-8.5-6.6-8.5-10.1C3.5 8 5.3 6 7.7 6c1.7 0 3.2.9 4.3 2.5C13.1 6.9 14.6 6 16.3 6c2.4 0 4.2 2 4.2 4.4 0 3.5-3 6.4-8.5 10.1z"/></svg>
        </button>
        <button class="act act-info" id="btnInfo" data-i18n-attr="aria-label:info;title:infoTitle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
        </button>
      </div>
    </main>

    <aside class="matches" id="matches" data-i18n-attr="aria-label:matchesAria">
      <div class="matches-head">
        <h2 data-i18n="matchesTitle"></h2>
        <button class="icon-btn close-matches" id="closeMatches" data-i18n-attr="aria-label:closeMatches">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="seg" role="tablist" id="matchTabs">
        <button role="tab" aria-selected="true" data-tab="all" data-i18n="tabAll"></button>
        <button role="tab" aria-selected="false" data-tab="super" data-i18n="tabSuper"></button>
      </div>
      <ul class="match-list" id="matchList"></ul>
      <button class="link-btn danger" id="resetAll" data-i18n="resetAll"></button>
    </aside>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <div class="modal" id="matchModal" role="dialog" aria-modal="true" aria-labelledby="mmTitle" hidden>
    <div class="modal-card">
      <div class="mm-burst" aria-hidden="true"></div>
      <p class="mm-kicker" data-i18n="itsMatch"></p>
      <img id="mmImg" alt="">
      <h3 id="mmTitle"></h3>
      <p data-i18n="matchText"></p>
      <div class="mm-actions">
        <a id="mmSteam" class="btn btn-primary" target="_blank" rel="noopener" data-i18n="openSteam"></a>
        <button class="btn btn-ghost" id="mmClose" data-i18n="keepSwiping"></button>
      </div>
    </div>
  </div>

  <div class="modal lang-modal" id="langModal" role="dialog" aria-modal="true" aria-labelledby="langTitle" hidden>
    <div class="modal-card lang-card">
      <button class="icon-btn lang-close" id="langClose" data-i18n-attr="aria-label:langClose" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="lang-fan" aria-hidden="true"><i></i><i></i><i></i></div>
      <h3 id="langTitle" class="lang-title"></h3>
      <div class="lang-list" id="langList"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js?v=2"></script>
  <script src="data/games.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
